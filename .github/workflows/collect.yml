name: collect

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install matplotlib
        run: pip install matplotlib

      - name: Collect snapshot
        id: collect
        continue-on-error: true   # exit 2 = API/network failure; still re-render and commit the log
        run: python collect.py

      - name: Render charts
        run: python chart.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv data/collect.log chart.html chart.png
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
