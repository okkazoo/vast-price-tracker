<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vast.ai GPU prices</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff; --panel: #f6f7f9; --fg: #1b1f24; --muted: #5d6673;
  --grid: rgba(0,0,0,0.08); --border: #d9dde3; --accent: #2f6fdf;
  --up: #c0392b; --down: #1f9d6b;
  --c3090: #2f6fdf; --c4090: #e0741c; --c5090: #1f9d6b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #181c22; --fg: #e6e9ee; --muted: #98a2b0;
    --grid: rgba(255,255,255,0.08); --border: #2a3039; --accent: #6ea0ff;
    --up: #ff7b6b; --down: #4fd39e;
    --c3090: #6ea0ff; --c4090: #ff9d4d; --c5090: #4fd39e;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 12px; }
h1 { font-size: 18px; margin: 4px 0 2px; }
.sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.group { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.group button { background: var(--panel); color: var(--fg); border: 0; padding: 6px 12px;
  font: inherit; cursor: pointer; border-right: 1px solid var(--border); }
.group button:last-child { border-right: 0; }
.group button.on { background: var(--accent); color: #fff; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 10px; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.stat .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.stat .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.stat .val { font-size: 20px; font-variant-numeric: tabular-nums; }
.stat .chg { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 10px; }
.panel h2 { font-size: 13px; font-weight: 600; margin: 0 0 4px; color: var(--muted); }
.price { position: relative; height: 360px; }
.supply { position: relative; height: 200px; }
@media (max-width: 600px) { .price { height: 280px; } .supply { height: 170px; } }
</style>
</head>
<body>
<main>
  <h1>Vast.ai on-demand GPU prices ($/GPU/hr)</h1>
  <div class="sub" id="updated"></div>
  <div class="controls">
    <div class="group" id="subset">
      <button data-v="all" class="on">All offers</button>
      <button data-v="reliable">Reliable &ge;0.98</button>
    </div>
    <div class="group" id="range">
      <button data-v="24">24h</button>
      <button data-v="168" class="on">7d</button>
      <button data-v="720">30d</button>
      <button data-v="0">All</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="panel"><h2>Median per-GPU price (band p25&ndash;p75, dashed = mean of 5 cheapest)</h2>
    <div class="price"><canvas id="price"></canvas></div></div>
  <div class="panel"><h2>Supply: rentable GPUs listed</h2>
    <div class="supply"><canvas id="supply"></canvas></div></div>
</main>
<script>
const DATA = {"all":{"RTX 3090":[[1790314500000,0.1756,0.1489,0.2548,0.1198,294.0,149.0],[1790314560000,0.1741,0.1489,0.2439,0.1193,289.0,148.0],[1790317020000,0.1874,0.1526,0.2529,0.121,316.0,158.0],[1790317860000,0.187,0.1515,0.2678,0.1208,332.0,169.0],[1790317860000,0.1874,0.1515,0.2689,0.1221,335.0,169.0],[1790321160000,0.1878,0.1489,0.2674,0.1196,302.0,156.0],[1790340360000,0.1822,0.1489,0.2536,0.1203,233.0,131.0],[1790359020000,0.1766,0.1509,0.2406,0.1193,239.0,136.0],[1790372040000,0.1874,0.1619,0.2444,0.1196,221.0,131.0],[1790383020000,0.1774,0.1497,0.2405,0.1187,282.0,150.0],[1790402940000,0.1802,0.1489,0.2419,0.1187,295.0,149.0],[1790421840000,0.1756,0.1489,0.2323,0.1203,338.0,161.0],[1790439780000,0.1872,0.1616,0.2526,0.1206,266.0,135.0]],"RTX 4090":[[1790314500000,0.4956,0.4353,0.6005,0.2543,582.0,218.0],[1790314560000,0.4956,0.4289,0.5863,0.2488,590.0,219.0],[1790317020000,0.5069,0.441,0.6015,0.257,650.0,240.0],[1790317860000,0.507,0.4402,0.6022,0.2341,682.0,257.0],[1790317860000,0.5069,0.4404,0.6275,0.2515,682.0,257.0],[1790321160000,0.5076,0.4336,0.6172,0.2485,675.0,252.0],[1790340360000,0.4956,0.4421,0.6017,0.249,568.0,219.0],[1790359020000,0.4956,0.4422,0.667,0.33,555.0,225.0],[1790372040000,0.4944,0.4402,0.5953,0.2954,465.0,211.0],[1790383020000,0.4948,0.4289,0.6554,0.2581,508.0,233.0],[1790402940000,0.4946,0.4406,0.6023,0.3044,617.0,246.0],[1790421840000,0.4915,0.4144,0.6681,0.2608,514.0,213.0],[1790439780000,0.4944,0.4336,0.6681,0.2752,679.0,255.0]],"RTX 5090":[[1790314500000,0.6678,0.5356,0.8004,0.4356,1060.0,315.0],[1790314560000,0.6678,0.5356,0.8006,0.436,1059.0,317.0],[1790317020000,0.6672,0.5352,0.7763,0.41,1007.0,319.0],[1790317860000,0.6676,0.5366,0.8004,0.3935,995.0,310.0],[1790317860000,0.6489,0.5344,0.8002,0.4093,1015.0,313.0],[1790321160000,0.6681,0.5356,0.8003,0.4194,991.0,299.0],[1790340360000,0.667,0.5344,0.7755,0.4064,930.0,282.0],[1790359020000,0.6289,0.5339,0.7941,0.3907,808.0,270.0],[1790372040000,0.6022,0.5336,0.7606,0.3827,711.0,263.0],[1790383020000,0.6023,0.5336,0.7672,0.3773,801.0,280.0],[1790402940000,0.6028,0.5336,0.7752,0.3902,878.0,302.0],[1790421840000,0.6289,0.5337,0.7754,0.3929,870.0,301.0],[1790439780000,0.6418,0.5339,0.8008,0.3665,863.0,286.0]]},"reliable":{"RTX 3090":[[1790314500000,0.1844,0.149,0.2691,0.1226,183.0,96.0],[1790314560000,0.1774,0.1489,0.2529,0.1197,174.0,93.0],[1790317020000,0.1889,0.1611,0.2674,0.1234,180.0,97.0],[1790317860000,0.1889,0.1611,0.3489,0.1208,207.0,111.0],[1790317860000,0.2005,0.1613,0.3484,0.1221,210.0,114.0],[1790321160000,0.1889,0.1491,0.3188,0.1196,199.0,109.0],[1790340360000,0.1822,0.1512,0.2869,0.1203,162.0,95.0],[1790359020000,0.1774,0.1563,0.2515,0.1193,156.0,93.0],[1790372040000,0.1878,0.1611,0.2499,0.1196,143.0,90.0],[1790383020000,0.1823,0.1563,0.2433,0.1187,171.0,98.0],[1790402940000,0.1802,0.1534,0.2523,0.1187,166.0,97.0],[1790421840000,0.1777,0.1511,0.2521,0.1203,201.0,108.0],[1790439780000,0.1914,0.1611,0.2681,0.1206,165.0,93.0]],"RTX 4090":[[1790314500000,0.4934,0.4405,0.6079,0.3451,452.0,164.0],[1790314560000,0.4911,0.4306,0.6035,0.3335,454.0,162.0],[1790317020000,0.5085,0.4405,0.6607,0.3439,501.0,178.0],[1790317860000,0.5074,0.4334,0.6284,0.3123,527.0,197.0],[1790317860000,0.5143,0.4405,0.6685,0.3361,527.0,192.0],[1790321160000,0.5216,0.4405,0.6676,0.3307,523.0,196.0],[1790340360000,0.5034,0.443,0.6674,0.336,456.0,165.0],[1790359020000,0.5135,0.4422,0.6704,0.3325,419.0,165.0],[1790372040000,0.4819,0.4403,0.6054,0.359,348.0,154.0],[1790383020000,0.4944,0.4291,0.6694,0.3451,412.0,186.0],[1790402940000,0.4833,0.4406,0.6681,0.3367,496.0,193.0],[1790421840000,0.4809,0.4137,0.6681,0.3272,408.0,162.0],[1790439780000,0.4833,0.4309,0.6691,0.3491,542.0,203.0]],"RTX 5090":[[1790314500000,0.6689,0.5356,0.8649,0.4472,832.0,248.0],[1790314560000,0.6696,0.5352,0.8669,0.436,828.0,251.0],[1790317020000,0.6726,0.5356,0.8006,0.4242,803.0,255.0],[1790317860000,0.6788,0.5363,0.8669,0.4171,784.0,245.0],[1790317860000,0.6678,0.5344,0.848,0.4236,805.0,247.0],[1790321160000,0.6814,0.5356,0.8015,0.4377,746.0,234.0],[1790340360000,0.6689,0.5341,0.8007,0.4203,698.0,216.0],[1790359020000,0.6489,0.5341,0.8011,0.4181,556.0,201.0],[1790372040000,0.6015,0.5336,0.8009,0.3831,458.0,189.0],[1790383020000,0.6156,0.5339,0.8009,0.3773,536.0,201.0],[1790402940000,0.6327,0.534,0.8012,0.3903,644.0,224.0],[1790421840000,0.657,0.5339,0.8015,0.3931,623.0,229.0],[1790439780000,0.6694,0.5344,0.8012,0.3732,625.0,216.0]]}};
const GPUS = ["RTX 3090", "RTX 4090", "RTX 5090"];
const H = 3600e3;
let subset = "all", rangeH = 168, priceChart = null, supplyChart = null;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const colorOf = g => css("--c" + g.split(" ").pop());
function alpha(hex, a) {
  const h = hex.replace("#", "");
  const v = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`;
}
// row: [t, median, p25, p75, cheap5, n_gpus, n_offers]
const pts = (rows, i) => rows.filter(r => r[i] !== null).map(r => ({x: r[0], y: r[i]}));

function latestT() {
  let t = 0;
  for (const s of Object.values(DATA)) for (const rows of Object.values(s))
    for (const r of rows) t = Math.max(t, r[0]);
  return t;
}
function firstT() {
  let t = Infinity;
  for (const s of Object.values(DATA)) for (const rows of Object.values(s))
    for (const r of rows) t = Math.min(t, r[0]);
  return t;
}
// x window: the chosen range, but never wider than the data actually collected
function xWindow() {
  const end = latestT(), start = firstT(), span = end - start;
  const pad = Math.max(span * 0.04, 10 * 60e3);
  const min = rangeH && span > rangeH * H ? end - rangeH * H : start - pad;
  return {min, max: end + pad};
}
function nearest(rows, target, tolH) {
  let best = null;
  for (const r of rows) if (r[1] !== null && Math.abs(r[0] - target) <= tolH * H &&
      (!best || Math.abs(r[0] - target) < Math.abs(best[0] - target))) best = r;
  return best;
}
function chg(cur, old, label) {
  if (!old) return `<span>${label}: n/a</span>`;
  const d = cur - old[1], pct = old[1] ? 100 * d / old[1] : 0;
  const cls = d > 0 ? "up" : d < 0 ? "down" : "";
  const sign = d > 0 ? "+" : "";
  return `<span class="${cls}">${label}: ${sign}${d.toFixed(3)} (${sign}${pct.toFixed(1)}%)</span>`;
}

function renderStats() {
  const el = document.getElementById("stats");
  el.innerHTML = GPUS.map(g => {
    const rows = DATA[subset][g];
    const last = [...rows].reverse().find(r => r[1] !== null);
    if (!last) return `<div class="stat"><div class="name">${g}</div><div class="val">&ndash;</div></div>`;
    const d1 = nearest(rows, last[0] - 24 * H, 3), d7 = nearest(rows, last[0] - 168 * H, 12);
    return `<div class="stat"><div class="name"><span class="dot" style="background:${colorOf(g)}"></span>${g}</div>
      <div class="val">$${last[1].toFixed(3)}</div>
      <div class="chg">cheap5 $${last[4] !== null ? last[4].toFixed(3) : "-"} &middot; ${last[5]} GPUs / ${last[6]} offers</div>
      <div class="chg">${chg(last[1], d1, "vs 24h")} &middot; ${chg(last[1], d7, "vs 7d")}</div></div>`;
  }).join("");
}

function baseOpts(yTitle, fmt) {
  const grid = css("--grid"), fg = css("--muted");
  const xw = xWindow();
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: {mode: "nearest", axis: "x", intersect: false},
    scales: {
      x: {type: "time", min: xw.min, max: xw.max,
          grid: {color: grid}, ticks: {color: fg, maxRotation: 0, autoSkipPadding: 16}},
      y: {grid: {color: grid}, ticks: {color: fg, callback: fmt}, title: {display: true, text: yTitle, color: fg}}
    },
    plugins: {
      legend: {labels: {color: css("--fg"), boxWidth: 12, filter: i => !i.text.startsWith("_")}},
      tooltip: {filter: i => !i.dataset.label.startsWith("_")}
    }
  };
}

function render() {
  const n = Math.max(...GPUS.map(g => DATA[subset][g].length), 0);
  const r = n <= 60 ? 3 : 0;
  const pDs = [], sDs = [];
  for (const g of GPUS) {
    const rows = DATA[subset][g], c = colorOf(g);
    pDs.push({label: "_p25 " + g, data: pts(rows, 2), borderWidth: 0, pointRadius: 0, fill: false, borderColor: "transparent"});
    pDs.push({label: "_p75 " + g, data: pts(rows, 3), borderWidth: 0, pointRadius: 0, fill: "-1",
              borderColor: "transparent", backgroundColor: alpha(c, 0.15)});
    pDs.push({label: g + " median", data: pts(rows, 1), borderColor: c, backgroundColor: c,
              borderWidth: 2, pointRadius: r, pointHoverRadius: 5, fill: false, tension: 0.2});
    pDs.push({label: g + " cheap5", data: pts(rows, 4), borderColor: c, backgroundColor: c,
              borderWidth: 1.5, borderDash: [5, 4], pointRadius: r ? 2 : 0, fill: false, tension: 0.2});
    sDs.push({label: g, data: pts(rows, 5), borderColor: c, backgroundColor: c,
              borderWidth: 2, pointRadius: r, fill: false, tension: 0.2});
  }
  if (priceChart) priceChart.destroy();
  if (supplyChart) supplyChart.destroy();
  priceChart = new Chart(document.getElementById("price"),
    {type: "line", data: {datasets: pDs}, options: baseOpts("$/GPU/hr", v => "$" + Number(v).toFixed(2))});
  supplyChart = new Chart(document.getElementById("supply"),
    {type: "line", data: {datasets: sDs}, options: baseOpts("GPUs", v => v)});
  renderStats();
}

function wire(id, set) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle("on", x === b));
    set(b.dataset.v); render();
  }));
}
wire("subset", v => subset = v);
wire("range", v => rangeH = Number(v));
const lt = latestT();
document.getElementById("updated").textContent = lt
  ? "Latest snapshot: " + new Date(lt).toISOString().slice(0, 16).replace("T", " ") + " UTC  (generated 2026-09-26 16:23 UTC)"
  : "No data yet.";
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
render();
</script>
</body>
</html>
